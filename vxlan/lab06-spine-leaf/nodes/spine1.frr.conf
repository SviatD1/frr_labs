! daemons: ospfd bfdd
frr version 8.4
frr defaults datacenter
hostname spine1
log syslog informational
service integrated-vtysh-config
!
interface eth1
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth2
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
!
interface eth3
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf bfd
!
interface lo
 ip ospf area 0
!
router ospf
 maximum-paths 8
 ospf router-id 10.0.0.1
 passive-interface lo
!
line vty
!
