! daemons: ospfd bgpd
frr version 8.4
frr defaults datacenter
hostname leaf3
log syslog informational
service integrated-vtysh-config
!
interface eth1
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip ospf area 0
 ip ospf network point-to-point
!
interface lo
 ip ospf area 0
!
router ospf
 ospf router-id 10.0.0.13
 passive-interface lo
!
router bgp 65000
 bgp router-id 10.0.0.13
 no bgp default ipv4-unicast
 neighbor SPINES peer-group
 neighbor SPINES remote-as internal
 neighbor SPINES update-source lo
 neighbor 10.0.0.1 peer-group SPINES
 neighbor 10.0.0.2 peer-group SPINES
 !
 address-family l2vpn evpn
  neighbor SPINES activate
  advertise-all-vni
  vni 10010
   rd 10.0.0.13:10
   route-target import 65000:10010
   route-target export 65000:10010
  exit-vni
  vni 10020
   rd 10.0.0.13:20
   route-target import 65000:10020
   route-target export 65000:10020
  exit-vni
 exit-address-family
!
line vty
!
