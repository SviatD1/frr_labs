! daemons: ospfd bgpd
frr version 8.4
frr defaults datacenter
hostname spine2
log syslog informational
service integrated-vtysh-config
!
interface eth1
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth3
 ip ospf area 0
 ip ospf network point-to-point
!
interface lo
 ip ospf area 0
!
router ospf
 ospf router-id 10.0.0.2
 passive-interface lo
!
router bgp 65000
 bgp router-id 10.0.0.2
 no bgp default ipv4-unicast
 bgp cluster-id 10.0.0.2
 neighbor LEAVES peer-group
 neighbor LEAVES remote-as internal
 neighbor LEAVES update-source lo
 neighbor 10.0.0.11 peer-group LEAVES
 neighbor 10.0.0.12 peer-group LEAVES
 neighbor 10.0.0.13 peer-group LEAVES
 !
 address-family l2vpn evpn
  neighbor LEAVES activate
  neighbor LEAVES route-reflector-client
 exit-address-family
!
line vty
!
