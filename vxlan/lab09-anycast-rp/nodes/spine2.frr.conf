! daemons: ospfd pimd
frr version 8.4
frr defaults datacenter
hostname spine2
log syslog informational
service integrated-vtysh-config
!
interface eth3
 ip ospf area 0
 ip ospf network point-to-point
 ip pim
 ip igmp
!
interface eth4
 ip ospf area 0
 ip ospf network point-to-point
 ip pim
!
interface lo
 ip ospf area 0
 ip pim
!
router ospf
 ospf router-id 10.0.0.2
 passive-interface lo
!
ip pim rp 10.255.255.1 239.0.0.0/8
ip msdp mesh-group ANYCAST-RP source 10.0.0.2
ip msdp mesh-group ANYCAST-RP member 10.0.0.1
!
line vty
!
