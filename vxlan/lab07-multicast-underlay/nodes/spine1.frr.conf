! daemons: ospfd pimd
frr version 8.4
frr defaults datacenter
hostname spine1
log syslog informational
service integrated-vtysh-config
!
interface eth1
 ip ospf area 0
 ip ospf network point-to-point
 ip pim
 ip igmp
!
interface eth2
 ip ospf area 0
 ip ospf network point-to-point
 ip pim
 ip igmp
!
interface eth3
 ip ospf area 0
 ip ospf network point-to-point
 ip pim
 ip igmp
!
interface lo
 ip ospf area 0
 ip pim
!
router ospf
 ospf router-id 10.0.0.1
 passive-interface lo
!
ip pim rp 10.0.0.1 239.0.0.0/8
!
line vty
!
