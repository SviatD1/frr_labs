frr defaults traditional
hostname R4
log syslog informational
service integrated-vtysh-config
!
        bgp community-list standard BACKUP seq 5 permit 200:80
        route-map FROM-CUSTOMER permit 10
         match community BACKUP
         set local-preference 80
        exit
        route-map FROM-CUSTOMER permit 20
        exit
        !
        router bgp 200
 bgp router-id 4.4.4.4
 no bgp ebgp-requires-policy
 neighbor 10.0.14.1 remote-as 100
 neighbor 10.0.24.2 remote-as 200
 neighbor 10.0.34.3 remote-as 300
 !
 address-family ipv4 unicast
  neighbor 10.0.14.1 route-map FROM-CUSTOMER in
  neighbor 10.0.24.2 next-hop-self
 exit-address-family
exit
!
line vty
!
end
