!
frr defaults traditional
hostname R2
log syslog informational
service integrated-vtysh-config
!
router bgp 200
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 100
 neighbor 10.0.24.4 remote-as 200
 !
 address-family ipv4 unicast
  neighbor 10.0.12.1 route-map FROM-CUSTOMER in
  neighbor 10.0.24.4 next-hop-self
 exit-address-family
exit
!
bgp community-list standard BACKUP seq 5 permit 200:80
!
route-map FROM-CUSTOMER permit 10
 match community BACKUP
 set local-preference 80
exit
!
route-map FROM-CUSTOMER permit 20
exit
!
end
