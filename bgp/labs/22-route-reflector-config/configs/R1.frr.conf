frr defaults traditional
hostname R1
log syslog informational
service integrated-vtysh-config
!
interface eth0
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth1
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface lo
 ip ospf area 0
exit
!
router ospf
 ospf router-id 1.1.1.1
exit
!
!
line vty
!
end
