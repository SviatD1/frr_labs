!
frr defaults traditional
hostname R1
log syslog informational
service integrated-vtysh-config
!
router bgp 100
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 200
 neighbor 10.0.14.4 remote-as 400
 !
 address-family ipv4 unicast
  network 192.168.1.0/24
  neighbor 10.0.12.2 soft-reconfiguration inbound
  neighbor 10.0.12.2 route-map FROM-R2 in
  neighbor 10.0.12.2 route-map OWN-ONLY out
  neighbor 10.0.14.4 route-map OWN-ONLY out
 exit-address-family
exit
!
bgp as-path access-list OWN seq 5 permit ^$
bgp as-path access-list VIA300 seq 5 permit _300_
!
route-map OWN-ONLY permit 10
 match as-path OWN
exit
!
route-map FROM-R2 deny 10
 match as-path VIA300
exit
!
route-map FROM-R2 permit 20
exit
!
end
